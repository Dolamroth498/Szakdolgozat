  <p *ngIf="loading$ | async">Profil betöltése...</p>
  <p *ngIf="error$ | async as error" role="alert">{{ error }}</p>
  <div *ngIf="user$ | async as user">
    <h2>{{ user.name }} - Profil</h2>
    <p>Email: {{ user.email }}</p>
    <p>A játékbeli egyenleg és pontok mentése későbbi fejlesztés.</p>
  </div>
  <button mat-flat-button
    color="accent"
    (click)="backToMain()">Back</button>
