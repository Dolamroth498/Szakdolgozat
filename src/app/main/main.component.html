<div class="main-container">
  <h1>Üdvözöllek a játékban!</h1>
  <p *ngIf="storageError" role="alert">{{ storageError }}</p>
  <button *ngIf="hasPausedGame" type="button" (click)="resumeGame()">
    Játék folytatása
  </button>
  <div class="actions">
    <ng-container *ngIf="isChoosingGameMode; else newGame">
      <p>Kivel szeretnél játszani?</p>
      <button (click)="startGame('computer')">Gép ellen</button>
      <button (click)="startGame('human')">Emberek ellen</button>
    </ng-container>
    <ng-template #newGame>
      <button (click)="showGameModeChoice()">Új játék</button>
    </ng-template>
  </div>
</div>
